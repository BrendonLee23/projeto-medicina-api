services:
  - type: web
    name: projeto-medicina-api
    runtime: node
    region: oregon
    plan: free
    rootDir: Backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: projeto-medicina-db
    plan: free
    region: oregon
    databaseName: projeto_medicina
    user: medicina
